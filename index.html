<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaseBattle - Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0b0e14; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #2a3859; background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'); background-size: cover; }
        .name { font-size: 14px; font-weight: 600; }
        .level { font-size: 11px; color: #8a96a3; }
        .balance-container { display: flex; align-items: center; background: #151922; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 4px 4px 4px 12px; gap: 8px; }
        .balance-text { font-size: 13px; font-weight: 700; }
        .plus-btn { width: 28px; height: 28px; border-radius: 50%; background: #246bfd; border: none; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .crash-card { background: #131823; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); padding: 16px; text-align: center; }
        .multiplier { font-size: 40px; font-weight: 800; color: #38ef7d; margin: 15px 0; }
        .bet-btn { background: #246bfd; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; }
        .nav-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #131823; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6c7a9c; font-size: 10px; text-decoration: none; }
        .nav-item.active { color: #246bfd; }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div class="avatar"></div>
            <div>
                <div class="name" id="userName">Amy</div>
                <div class="level">Рівень 1</div>
            </div>
        </div>
        <div class="balance-container">
            <span class="balance-text">25.00 GRAM</span>
            <button class="plus-btn" onclick="alert('Депозит')">+</button>
        </div>
    </div>
    <div class="content">
        <div class="crash-card">
            <div style="font-size: 12px; color: #8a96a3;">ЛЕТИТЬ</div>
            <div class="multiplier" id="mult">1.00x</div>
            <button class="bet-btn">Зробити ставку</button>
        </div>
    </div>
    <div class="nav-bar">
        <a class="nav-item" href="#">📦 Інвентар</a>
        <a class="nav-item active" href="#">🚀 Ігри</a>
        <a class="nav-item" href="#">⚔️ PvP</a>
        <a class="nav-item" href="#">🏆 Лідери</a>
        <a class="nav-item" href="#">👤 Профіль</a>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }
        let m = 1.00;
        setInterval(() => {
            m += 0.04;
            if(m > 4.0) m = 1.00;
            document.getElementById('mult').innerText = m.toFixed(2) + 'x';
        }, 150);
    </script>
</body>
</html>
