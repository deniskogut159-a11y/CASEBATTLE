<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StonksGift - Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0b0e14;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a3859;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100');
            background-size: cover;
        }

        .name {
            font-size: 14px;
            font-weight: 600;
        }

        .level {
            font-size: 11px;
            color: #8a96a3;
        }

        .balance-container {
            display: flex;
            align-items: center;
            background: #151922;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 4px 4px 12px;
            gap: 8px;
        }

        .balance-text {
            font-size: 13px;
            font-weight: 700;
        }

        .plus-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #246bfd;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #38ef7d;
            background: rgba(56, 239, 125, 0.1);
            padding: 4px 10px;
            border-radius: 10px;
            width: fit-content;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #38ef7d;
            border-radius: 50%;
        }

        .crash-card {
            background: #131823;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .multiplier {
            font-size: 46px;
            font-weight: 800;
            color: #38ef7d;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
        }

        .bet-box {
            background: #1a2233;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bet-label {
            font-size: 13px;
            color: #8a96a3;
            text-align: left;
        }

        .bet-input {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: transparent;
            border: none;
            outline: none;
            width: 90px;
            text-align: right;
        }

        .bet-btn {
            background: #246bfd;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(36, 107, 253, 0.3);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #131823;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6c7a9c;
            font-size: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #246bfd;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="userAvatar"></div>
            <div>
                <div class="name" id="userName">Amy</div>
                <div class="level">Рівень 1</div>
            </div>
        </div>
        <div class="balance-container">
            <span class="balance-text" id="balanceNum">25.00 GRAM</span>
            <button class="plus-btn" onclick="openDeposit()">+</button>
        </div>
    </div>

    <div class="content">
        <div class="online-badge">
            <div class="online-dot"></div>
            <span id="onlineCount">986 Онлайн</span>
        </div>

        <div class="crash-card">
            <div id="statusText" style="font-size: 12px; color: #8a96a3; text-transform: uppercase; letter-spacing: 0.5px;">Раунд триває</div>
            <div class="multiplier" id="multiplierDisplay">1.00x</div>
            
            <div style="font-size: 40px; margin: 10px 0;">🚀</div>

            <div class="bet-box">
                <div class="bet-label">Ставка (GRAM):</div>
                <div>
                    <input type="number" class="bet-input" value="10" id="betAmountInput">
                </div>
            </div>

            <button class="bet-btn" id="actionButton" onclick="handleBetAction()">Зробити ставку</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item">📦 <span>Інвентар</span></div>
        <div class="nav-item active">🚀 <span>Ракетка</span></div>
        <div class="nav-item">⚔️ <span>Алгрейд</span></div>
        <div class="nav-item">🏆 <span>Лідери</span></div>
        <div class="nav-item">👤 <span>Профіль</span></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }

        let isPlaying = false;
        let currentMultiplier = 1.00;
        let gameInterval = null;

        function handleBetAction() {
            let btn = document.getElementById('actionButton');
            let status = document.getElementById('statusText');
            
            if (!isPlaying) {
                isPlaying = true;
                btn.innerText = "Забрати виграш";
                btn.style.background = "#ff3b30";
                status.innerText = "Ракета летить...";
                
                currentMultiplier = 1.00;
                gameInterval = setInterval(() => {
                    currentMultiplier += 0.04;
                    document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + 'x';
                    
                    // Рандомний крах
                    if (currentMultiplier > (Math.random() * 5 + 1.5)) {
                        crashGame();
                    }
                }, 150);
            } else {
                // Забрати виграш
                alert("Ви успішно забрали виграш!");
                resetGame();
            }
        }

        function crashGame() {
            clearInterval(gameInterval);
            document.getElementById('statusText').innerText = "ПЕРЕБІЙ / CRASH!";
            document.getElementById('actionButton').innerText = "Зробити ставку";
            document.getElementById('actionButton').style.background = "#246bfd";
            setTimeout(() => {
                resetGame();
            }, 2000);
        }

        function resetGame() {
            clearInterval(gameInterval);
            isPlaying = false;
            currentMultiplier = 1.00;
            document.getElementById('multiplierDisplay').innerText = "1.00x";
            document.getElementById('statusText').innerText = "Раунд триває";
            document.getElementById('actionButton').innerText = "Зробити ставку";
            document.getElementById('actionButton').style.background = "#246bfd";
        }

        function openDeposit() {
            alert("Відкриття каталогу подарунків та поповнення балансу");
        }
    </script>
</body>
</html>
